spring.application.name=token-standard-auditor

# Durable store (SQLite). Override auditor.data-dir for tests/deployments.
auditor.data-dir=${user.home}/.token-standard-auditor
spring.datasource.url=jdbc:sqlite:${auditor.data-dir}/auditor.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Audit execution
auditor.check-timeout-ms=30000
auditor.executor-core-size=4
auditor.executor-max-size=8
auditor.executor-queue-capacity=100
